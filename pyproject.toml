[project]
name = "object-storage"
version = "0.15.3"
description = "Python library for accessing files over various file transfer protocols."
authors = [{name = "uStudio Developers", email = "dev@ustudio.com"}]
repository = "https://github.com/ustudio/storage"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10,<4"
dynamic = ["dependencies"]

[tool.poetry]
requires-poetry = ">=2.4.1"
packages = [{include = "storage"}]

[tool.poetry.dependencies]
boto3 = "^1.35.68"
google-cloud-storage = "^2.18.2"
python-swiftclient = "^4.6.0"
keystoneauth1 = "^5.9.0"

[tool.poetry.group.dev.dependencies]
flake8 = "^7.3.0"
mypy = "^2.3.0"
pytest = "^9.1.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
